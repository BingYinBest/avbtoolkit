name: build

on:
  push:
    branches: ['main', 'master']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  toolchain:
    name: toolchain (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd file

      - name: Set up Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Assemble toolchain.zip
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p build
          if bash scripts/fetch-toolchain.sh > build/assemble.log 2>&1; then
            tail -20 build/assemble.log
          else
            echo "ASSEMBLE FAILED"; tail -120 build/assemble.log; exit 1
          fi

      - name: Upload assemble log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: assemble-log
          path: build/assemble.log
          if-no-files-found: ignore

      - name: Smoke test — run aarch64 binaries via qemu
        run: |
          sudo apt-get install -y --no-install-recommends qemu-user-static
          mkdir -p build
          set +e
          qemu-aarch64-static build/final/jni/arm64-v8a/python3.10 --version > build/smoke.log 2>&1
          echo "python exit=$?" >> build/smoke.log
          qemu-aarch64-static build/final/jni/arm64-v8a/openssl version >> build/smoke.log 2>&1
          echo "openssl exit=$?" >> build/smoke.log
          # fec（NDK 静态 bionic）的 TLS 段对齐检查是 qemu-user 的已知限制，真机 bionic loader 正常，此处跳过
          cat build/smoke.log
          grep -q "Python 3" build/smoke.log && grep -q "OpenSSL" build/smoke.log || exit 1

      - name: Upload smoke log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: build/smoke.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: toolchain
          path: build/toolchain/toolchain.zip
          if-no-files-found: error

  android:
    name: android build
    runs-on: ubuntu-latest
    needs: toolchain
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: toolchain
          path: toolchain-artifact

      - name: Install toolchain into app
        run: |
          cd "$RUNNER_TEMP"
          unzip -q -o "$GITHUB_WORKSPACE/toolchain-artifact/toolchain.zip"
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs" "$GITHUB_WORKSPACE/app/src/main/assets"
          cp -r jni/arm64-v8a "$GITHUB_WORKSPACE/app/src/main/jniLibs/"
          cp assets/* "$GITHUB_WORKSPACE/app/src/main/assets/"
          ls -la "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/" "$GITHUB_WORKSPACE/app/src/main/assets/"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          # android-37.0 在 canary 通道（channel=3），stable 仓库目前最高 36
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          GRADLE_ARGS=":app:assembleDebug"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            GRADLE_ARGS="$GRADLE_ARGS :app:assembleRelease \
              -PKEYSTORE_FILE=$PWD/keystore.jks \
              -PKEYSTORE_PASSWORD=$KEYSTORE_PASSWORD \
              -PKEY_ALIAS=$KEY_ALIAS \
              -PKEY_PASSWORD=$KEY_PASSWORD"
          fi
          mkdir -p build
          if ./gradlew $GRADLE_ARGS --no-daemon > build/gradle.log 2>&1; then
            tail -25 build/gradle.log
          else
            echo "GRADLE FAILED"; tail -200 build/gradle.log; exit 1
          fi

      - name: Upload gradle log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: build/gradle.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  smoke:
    name: avbtool end-to-end
    runs-on: ubuntu-latest
    needs: toolchain
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: toolchain
          path: toolchain-artifact

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 openssl build-essential

      - name: avbtool sign → verify → info (host native toolchain)
        run: |
          mkdir -p build
          set +e
          bash -c '
            cd "$RUNNER_TEMP"
            # host 版 fec（用户仓库 native 构建），供 avbtool 的 FEC 链路使用
            git clone --depth 1 https://github.com/BingYinBest/fec.git
            bash fec/build.sh native
            export PATH="$PWD/fec/out/native:$PATH"
            # avbtool.py 取自 toolchain artifact（其余 aarch64 二进制由 qemu 冒烟验证）
            unzip -q -o "$GITHUB_WORKSPACE/toolchain-artifact/toolchain.zip" assets/avbtool.py
            mkdir -p bin && mv assets/avbtool.py bin/avbtool.py
            # 生成测试密钥
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out key.pem
            # 哈希 footer（boot）
            dd if=/dev/urandom of=boot.img bs=4096 count=64
            python3 bin/avbtool.py add_hash_footer \
              --image boot.img --partition_size 524288 --partition_name boot \
              --algorithm SHA256_RSA2048 --key key.pem --hash_algorithm sha256
            python3 bin/avbtool.py info_image --image boot.img | grep "Algorithm: SHA256_RSA2048"
            python3 bin/avbtool.py verify_image --image boot.img --key key.pem
            # 哈希树 + FEC（system，走 host fec）
            dd if=/dev/urandom of=system.img bs=4096 count=128
            python3 bin/avbtool.py add_hashtree_footer \
              --image system.img --partition_size 1048576 --partition_name system \
              --algorithm SHA256_RSA2048 --key key.pem --fec_num_roots 2 --hash_algorithm sha256
            python3 bin/avbtool.py verify_image --image system.img --key key.pem
            # 禁验 vbmeta
            python3 bin/avbtool.py make_vbmeta_image \
              --output vbmeta-disable.img --algorithm NONE --flags 2 --padding_size 4096
            python3 bin/avbtool.py verify_image --image vbmeta-disable.img
            echo "SMOKE OK"
          ' > build/smoke-host.log 2>&1
          RC=$?
          tail -60 build/smoke-host.log
          exit $RC

      - name: Upload host smoke log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-host-log
          path: build/smoke-host.log
          if-no-files-found: ignore

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: [android]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks
      - uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
